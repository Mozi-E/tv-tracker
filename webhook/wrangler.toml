# Deploy with:  cd webhook && npx wrangler deploy
# (or paste worker.js into the Cloudflare dashboard - see README.md)

name = "tv-tracker-webhook"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret vars. Secrets (GH_APP_PRIVATE_KEY, TELEGRAM_SECRET_TOKEN,
# ALLOWED_USER_IDS) are set with:  npx wrangler secret put GH_APP_PRIVATE_KEY  (etc.)
[vars]
GH_REPO = "Mozi-E/tv-tracker"
GH_APP_ID = "PUT_YOUR_APP_ID_HERE"
GH_APP_INSTALLATION_ID = "PUT_YOUR_INSTALLATION_ID_HERE"

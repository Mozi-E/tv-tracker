name: Check for new seasons & sequels

on:
  schedule:
    # Once a day, ~06:17 UTC. GitHub may delay scheduled runs by a few minutes.
    - cron: "17 6 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab
  repository_dispatch:
    types: [telegram]      # fired by the Cloudflare Worker on each Telegram message

permissions:
  contents: write          # needed to commit the updated state back

concurrency:
  group: tv-tracker        # serialise runs so state commits never race
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}          # optional
          # Set the repo VARIABLE TELEGRAM_WEBHOOK_MODE=1 once the webhook is live
          # so scheduled runs don't try getUpdates (which 409s under a webhook).
          TELEGRAM_WEBHOOK_MODE: ${{ vars.TELEGRAM_WEBHOOK_MODE }}
          # Present only on repository_dispatch runs; "null" otherwise.
          TELEGRAM_UPDATE_JSON: ${{ toJSON(github.event.client_payload.update) }}
        run: python check.py

      - name: Commit updated state
        run: |
          git config user.name "tv-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titles.json data/state.json data/maintenance.json data/invites.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update tracker state"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
